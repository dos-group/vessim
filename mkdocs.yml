site_name: Vessim
site_url: !ENV READTHEDOCS_CANONICAL_URL
repo_url: https://github.com/dos-group/vessim

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/readthedocs.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Getting Started: getting_started.md
  - Concepts:
    - Actors and Signals: concepts/signals.md
    - Dispatchables and Policies: concepts/dispatchables.md
    - Controllers: concepts/controllers.md
    - Results and Metrics: concepts/results.md
    - Connect External Simulators: concepts/coupling.md
    - Optimization: concepts/optimization.md
  - Use Cases:
    - Simulation Studies: concepts/studies.md
    - Live Simulation: concepts/live.md
  - Vessim Viewer: vessim_viewer.md
  - API Reference:
    - Environment: api_reference/environment.md
    - Microgrid: api_reference/microgrid.md
    - Actors: api_reference/actor.md
    - Signals: api_reference/signal.md
    - Dispatchables: api_reference/dispatchable.md
    - Dispatch Policies: api_reference/dispatch_policy.md
    - Controllers: api_reference/controller.md
    - Recording and Metrics: api_reference/recorder.md
  - Publications: publications.md
  - About: about.md

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo_white.svg
  favicon: assets/favicon.svg
  features:
    - toc.integrate
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: teal
      accent: teal

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            show_signature: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            show_source: false
            line_length: 80
            show_symbol_type_heading: true
            show_labels: true
            members_order: source
            filters:
              - "!^_"

markdown_extensions:
  - toc:
      toc_depth: 2
  - admonition
  - attr_list
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
